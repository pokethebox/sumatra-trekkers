<script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRwBd4gNfZ40xVK17b3VrYS_7pJaoCmxwUuzSHQbsLBZsuCxUR8B8mEp4TlHxUNSb4k3mxVyuSx5frb/pub?gid=0&single=true&output=csv';

        // This is a "Smart Splitter" that ignores commas inside quotes
        function csvToArray(text) {
            let p = '', Array = [[]], f = 0, r = 0;
            text.split('').forEach(c => {
                if (c === '"') f = !f;
                else if (c === ',' && !f) c = Array[r][++p] = '';
                else if (c === '\n' && !f) Array[++r] = [p = ''];
                else Array[r][p] += c;
            });
            return Array;
        }

        async function loadBoard() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                
                // Use the new Smart Splitter
                const rows = csvToArray(data).slice(1); 
                const wrapper = document.getElementById('board-wrapper');
                wrapper.innerHTML = '';

                rows.forEach(cols => {
                    // Check if row is empty
                    if (cols.length < 6 || !cols[0]) return;
                    
                    const paxCount = parseInt(cols[2]) || 0;
                    const occupancy = (paxCount / 6) * 100;
                    
                    wrapper.innerHTML += `
                        <div class="card">
                            <div class="status">${cols[6] || 'Gathering'}</div>
                            <div class="trek-title"><strong>${cols[0]}</strong></div>
                            <div class="date">📅 ${cols[1]}</div>
                            
                            <div class="progress-container">
                                <div class="progress-label">
                                    <span>${paxCount}/6 Spots</span>
                                    <span>${Math.round(occupancy)}% Full</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${occupancy}%"></div>
                                </div>
                            </div>

                            <div class="dna">
                                <strong>Crew:</strong> ${cols[3]}<br>
                                <strong>Ages:</strong> ${cols[4]}<br>
                                <strong>Fitness:</strong> ${cols[5]}/4
                            </div>
                        </div>
                    `;
                });
            } catch (e) { console.error(e); }
        }
        loadBoard();
    </script>
