<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        /* 1. Remove all page-level margins so cards sit flush */
        body { 
            margin: 0; 
            padding: 0; 
            background: transparent; /* Blends with Webflow background */
            font-family: sans-serif; 
        }

        /* 2. The Grid Layout */
        .board { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            width: 100%;
        }

        /* 3. Modern SaaS Card Styling */
        .card { 
            background: #1a1a1a; /* Dark gray card */
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid #333; 
            color: white;
            transition: transform 0.2s ease;
        }
        .card:hover { transform: translateY(-5px); border-color: #EE6D2B; }

        /* 4. Elements inside the card */
        .status { color: #EE6D2B; font-weight: bold; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        .trek-title { margin: 8px 0; font-size: 20px; }
        .date { color: #888; font-size: 14px; margin-bottom: 16px; }
        
        .progress-container { margin: 16px 0; }
        .progress-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; color: #ccc; }
        .progress-bar { background: #333; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-fill { background: #EE6D2B; height: 100%; }

        .dna { 
            background: rgba(255,255,255,0.05); 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 13px; 
            border-left: 3px solid #EE6D2B;
        }
    </style>
</head>
<body>

    <div id="board-wrapper" class="board"></div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRwBd4gNfZ40xVK17b3VrYS_7pJaoCmxwUuzSHQbsLBZsuCxUR8B8mEp4TlHxUNSb4k3mxVyuSx5frb/pub?gid=0&single=true&output=csv';

        async function loadBoard() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                const rows = data.split('\n').slice(1); 
                const wrapper = document.getElementById('board-wrapper');
                wrapper.innerHTML = '';

                rows.forEach(row => {
                    const cols = row.split(',');
                    if (cols.length < 6) return;
                    
                    const paxCount = parseInt(cols[2]) || 0;
                    const occupancy = (paxCount / 6) * 100;
                    
                    wrapper.innerHTML += `
                        <div class="card">
                            <div class="status">${cols[6] || 'Gathering'}</div>
                            <div class="trek-title"><strong>${cols[0]}</strong></div>
                            <div class="date">📅 ${cols[1]}</div>
                            
                            <div class="progress-container">
                                <div class="progress-label">
                                    <span>${paxCount}/6 Spots</span>
                                    <span>${Math.round(occupancy)}% Full</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${occupancy}%"></div>
                                </div>
                            </div>

                            <div class="dna">
                                <strong>Crew:</strong> ${cols[3]}<br>
                                <strong>Ages:</strong> ${cols[4]}<br>
                                <strong>Fitness:</strong> ${cols[5]}/4
                            </div>
                        </div>
                    `;
                });
            } catch (e) { console.error(e); }
        }
        loadBoard();
    </script>
</body>
</html>
